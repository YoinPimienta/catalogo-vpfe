{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}
    {% if change and original and original.estado == 'ACTIVO' %}
    <li>
        <a href="{% url 'admin:facturas_lote_cancelar' original.pk %}" class="viewsitelink" style="background: #991b1b !important; color: white !important; font-weight: bold; border-radius: 4px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); margin-right: 5px;">
            ❌ Cancelar Generación (Revertir)
        </a>
    </li>
    <li>
        <a href="{% url 'admin:facturas_lote_desactivar' original.pk %}" class="viewsitelink" style="background: #d97706 !important; color: white !important; font-weight: bold; border-radius: 4px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.15);">
            ⚠️ Desactivar Lote (Modo Seguro)
        </a>
    </li>
    {% endif %}
{% endblock %}
